name: Plugin regression tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins
      - uses: actions/checkout@v4
        with:
          repository: OKALLRIGHT1/Ren-bot
          path: host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r plugins/requirements-test.txt
      - run: python -m pytest -q plugins/tests
        env:
          REN_BOT_ROOT: ${{ github.workspace }}/host
